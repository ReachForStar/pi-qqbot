name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建产物
        run: npm run build

      - name: 版本一致性
        run: node -e "const p=require('./package.json');if(!p.version.match(/^\\d+\\.\\d+\\.\\d+/))process.exit(1)"

      - name: 许可证校验
        run: bash scripts/check-license.sh

      - name: 校验发布包内容
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.log
          grep -q "dist/cli.js" /tmp/pack.log
          grep -q "bin/pi-qqbot.js" /tmp/pack.log
          if grep -q "pi-qqbot.json" /tmp/pack.log; then
            echo "真实配置不应进包" && exit 1
          fi

  macos:
    name: verify (macos, node 22)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单元测试（`ps` 进程身份与 launchd 定义渲染）
        run: npm test

      - name: 构建产物
        run: npm run build
